[package]
name = "of-management"
version.workspace = true
edition.workspace = true
description = "openframe-management — replaces openframe-management-service-core. Admin service + scheduled tasks (Spring Scheduling) — tenant lifecycle, agent deployments, cleanup jobs. The Spring `@Scheduled` cron runners collapse to one tokio scheduler; the MongoDB-backed admin state lives in a hashtrinity::Table."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
hashtrinity = { workspace = true, features = ["codec", "derive"] }
tokio = { workspace = true, features = ["net", "io-util", "sync", "macros", "rt-multi-thread", "time"] }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["env"] }
uuid = { workspace = true }
openframe-domain = { path = "../openframe-domain" }