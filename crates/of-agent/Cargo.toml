[package]
name = "of-agent"
version.workspace = true
edition.workspace = true
description = "OpenFrame agent — replaces clients/openframe-client (Rust cross-platform system agent). Drop-in replacement for the openframe-agent-lib binary that talks to of-client-svc over the sangdb stack. Stays on tokio, drops async-nats, adds sangdb-bindings-kafka + sangdb-bindings-nats for messaging."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "sync", "macros", "rt-multi-thread", "time"] }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["env"] }
uuid = { workspace = true }
openframe-domain = { path = "../openframe-domain" }
sangdb-bindings-nats = { path = "../sangdb-bindings-nats" }
sangdb-bindings-kafka = { path = "../sangdb-bindings-kafka" }