[package]
name = "sangdb-bindings-pinot"
version.workspace = true
edition.workspace = true
description = "Apache Pinot SQL → sangdb vector + column faces. Replaces openframe-data-pinot (the real-time analytics store for streamed events). The OLAP face (column/foldKey) is the proven GROUP-BY fold (51–517× vs DuckDB on the CWI benchmark) — Pinot's SQL aggregation becomes fold_group with the matching monoid; ANN queries ride sangdb::lsh (proven, the same primitive qdrant subsumes)."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
hashtrinity = { workspace = true, features = ["codec", "derive"] }
bedrock = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "sync", "macros", "rt-multi-thread", "time"] }
thiserror = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
openframe-domain = { path = "../openframe-domain" }