[package]
name = "of-api"
version.workspace = true
edition.workspace = true
description = "openframe-api reference implementation — replaces openframe-api-service-core (Spring Boot + Netflix DGS GraphQL). REST + GraphQL endpoints served from a hashtrinity::Table row-face store. The DGS DataFetchers are reduced to hashtrinity::Table::get; every mutation is one Table::put; every query is a scan-prefix (per tenant). GraphQL support lives in of-api::graphql (over the same table); REST is the wire shape today."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
hashtrinity = { workspace = true, features = ["codec", "derive"] }
tokio = { workspace = true, features = ["net", "io-util", "sync", "macros", "rt-multi-thread", "time"] }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["env"] }
uuid = { workspace = true }
openframe-domain = { path = "../openframe-domain" }
sangdb-bindings-mongodb = { path = "../sangdb-bindings-mongodb" }