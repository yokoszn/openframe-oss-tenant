[package]
name = "sangdb-bindings-nats"
version.workspace = true
edition.workspace = true
description = "NATS JetStream → sangdb column/fold face + gossip. Replaces openframe-data-nats (used by the Rust agent for heartbeats and by of-client-svc for the agent control plane). Subject semantics drop out as TenantScoped keys; stream consumer groups ride the same fold-law as Kafka Streams — same collapse, no engine."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
hashtrinity = { workspace = true, features = ["codec", "derive"] }
bedrock = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "sync", "macros", "rt-multi-thread", "time"] }
thiserror = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
openframe-domain = { path = "../openframe-domain" }